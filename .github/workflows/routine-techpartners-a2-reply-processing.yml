name: Routine A2 -- tech-partners-squad weekly synthesis reply processing

# LIVE CUTOVER: see routine-techpartners-a-weekly-synthesis.yml's note -- Routine A
# confirmed via a real run; this Pass 2 was validated by structural/config diff against
# routine-connectors-a2.md (which did complete a real run and opened/merged a PR), not
# by an independent live run of its own. Cron enabled to match tech-partners-squad-kb's
# prior deterministic slot exactly; tech-partners-squad-kb's own
# routine-a2-reply-processing.yml is deleted in the same change so there is no window
# where both are live.

on:
  schedule:
    - cron: '0 20 * * 3'  # 20:00 UTC Wednesdays -- same deterministic slot tech-partners-squad-kb used
  workflow_dispatch:       # Manual trigger retained for testing

jobs:
  reply-processing:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-techpartners-a2.md
      model: claude-sonnet-5
      job_display_name: "tech partners weekly synthesis reply processing"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
