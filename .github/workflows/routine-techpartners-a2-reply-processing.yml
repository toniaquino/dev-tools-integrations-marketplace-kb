name: Routine A2 -- tech-partners-squad weekly synthesis reply processing

# PILOT CUTOVER (2026-08-14): workflow_dispatch only, no schedule yet -- see
# routine-techpartners-a-weekly-synthesis.yml's note. Do not add a schedule until
# Routine A's manual test is confirmed and this one has been manually validated
# against a real pushed branch too.

on:
  workflow_dispatch:       # Manual trigger only, for the pilot test

jobs:
  reply-processing:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-techpartners-a2.md
      model: claude-sonnet-5
      job_display_name: "tech partners weekly synthesis reply processing"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
