name: Routine A -- connectors-squad weekly synthesis

# LIVE CUTOVER (2026-08-14): pilot validated (Routine A push confirmed working across
# multiple runs, credential fix validated, Routine A2 mechanically validated -- see
# commit history). Cron enabled to match connectors-squad-kb's prior deterministic
# slot exactly; connectors-squad-kb's own routine-a-weekly-synthesis.yml is deleted
# in the same change so there is no window where both are live.

on:
  schedule:
    - cron: '0 7 * * 2'  # 07:00 UTC Tuesdays -- same deterministic slot connectors-squad-kb used
  workflow_dispatch:       # Manual trigger retained for testing

jobs:
  weekly-synthesis:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-connectors-a.md
      model: claude-sonnet-5
      job_display_name: "connectors weekly synthesis"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
