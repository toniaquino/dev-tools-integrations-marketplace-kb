name: Routine A -- connectors-squad weekly synthesis

# PILOT CUTOVER (2026-08-09): workflow_dispatch only, no schedule yet. This is the
# validation step before the cron is turned on and the old connectors-squad-kb
# workflow is deleted -- see distr-team-kb... no, dev-tools-integrations-marketplace-kb
# consolidation notes. Do not add a schedule here until a live workflow_dispatch run
# has been confirmed to push a correctly-pathed branch into 02 Teams/Connectors/.

on:
  workflow_dispatch:       # Manual trigger only, for the pilot test

jobs:
  weekly-synthesis:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-connectors-a.md
      model: claude-sonnet-5
      job_display_name: "connectors weekly synthesis"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
