name: Routine A2 -- connectors-squad weekly synthesis reply processing

# LIVE CUTOVER (2026-08-14): see routine-connectors-a-weekly-synthesis.yml's note.
# Cron enabled to match connectors-squad-kb's prior deterministic slot exactly;
# connectors-squad-kb's own routine-a2-reply-processing.yml is deleted in the same
# change. One known open item: this pilot's A2 run only exercised the
# no-thread-found fallback path, not a real thread match against a live
# notification -- worth a close look the first time the real Tuesday/Wednesday
# cycle completes on this schedule.

on:
  schedule:
    - cron: '0 19 * * 3'  # 19:00 UTC Wednesdays -- 36h after Tuesday's Pass 1, same slot connectors-squad-kb used
  workflow_dispatch:       # Manual trigger retained for testing

jobs:
  reply-processing:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-connectors-a2.md
      model: claude-sonnet-5
      job_display_name: "connectors weekly synthesis reply processing"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
