name: Routine A -- integrations-squad weekly synthesis

# LIVE CUTOVER: Routine A validated via a real workflow_dispatch run (2026-08-14,
# succeeded, pushed a correctly-pathed branch into 02 Teams/Integrations/). Routine A2
# was not exercised live (no confirmation reply existed on that run's thread to process)
# -- validated instead by structural/config diff against routine-connectors-a2.md, which
# did complete a real Pass 2 run and opened/merged a PR. Cron enabled to match
# integrations-squad-kb's prior deterministic slot exactly; integrations-squad-kb's own
# routine-a-weekly-synthesis.yml is deleted in the same change so there is no window
# where both are live.

on:
  schedule:
    - cron: '30 7 * * 2'  # 07:30 UTC Tuesdays -- same deterministic slot integrations-squad-kb used
  workflow_dispatch:       # Manual trigger retained for testing

jobs:
  weekly-synthesis:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-integrations-a.md
      model: claude-sonnet-5
      job_display_name: "integrations weekly synthesis"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
