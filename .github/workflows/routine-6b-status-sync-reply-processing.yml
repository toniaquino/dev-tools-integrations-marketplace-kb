name: Routine 6B -- weekly status sync reply processing (Pass 2)

# NEW (2026-08-19): see routine-6-weekly-status-sync.yml's note. Runs 36h after
# Monday's Pass 1.

on:
  schedule:
    - cron: '0 16 * * 2'  # 16:00 UTC Tuesdays -- ~36h after Monday's Pass 1
  workflow_dispatch:       # Manual trigger for testing

jobs:
  status-sync-pass2:
    uses: toni-aq/workflows/.github/workflows/reusable-routine-runner.yml@main
    with:
      repo_name: dev-tools-integrations-marketplace-kb
      prompt_path: .github/prompts/routine-6b.md
      model: claude-sonnet-5
      job_display_name: "weekly status sync reply processing"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
